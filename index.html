<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countify - Smart Counter App</title>
<link rel="stylesheet" href="style.css"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span class="logo-text">Countify</span>
    </div>
    <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>
  </div>

  <div class="counter-display">
    <div class="count-label">Current Count</div>
    <span class="count-number" id="count">0</span>
  </div>

  <div class="progress-section">
    <div class="progress-meta">
      <span class="progress-label">Progress to target</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <div class="counter-controls">
    <button class="ctrl-btn decrement" id="decrementBtn">−</button>
    <input class="step-input" type="number" id="customInput" placeholder="step" min="1" value="1"/>
    <button class="ctrl-btn increment" id="incrementBtn">+</button>
  </div>

  <div class="target-row">
    <div class="target-wrap">
      <span class="icon">🎯</span>
      <input class="target-input" type="number" id="targetInput" placeholder="Set target..." min="0"/>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn save" id="saveBtn">💾 Save</button>
    <button class="action-btn reset" id="resetBtn">↺ Reset</button>
    <button class="action-btn delete" id="deleteBtn">🗑 Clear</button>
  </div>

  <div class="history-section">
    <div class="history-header">
      <span class="history-title">History</span>
      <span class="history-count-badge" id="historyBadge">0 saved</span>
    </div>
    <ul class="history-list" id="historyList">
      <li class="empty-history">No saves yet — hit 💾 to record a count</li>
    </ul>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let count = 0;
  let target = 0;
  const countDisplay = document.getElementById("count");
  const progressBar = document.getElementById("progressBar");
  const progressPct = document.getElementById("progressPct");
  const historyList = document.getElementById("historyList");
  const historyBadge = document.getElementById("historyBadge");
  const toast = document.getElementById("toast");
  let toastTimer;

  function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add("show");
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function updateDisplay() {
    countDisplay.textContent = count;
    countDisplay.classList.add("bump");
    setTimeout(() => countDisplay.classList.remove("bump"), 200);
    updateProgress();
    localStorage.setItem("savedCount", count);
  }

  function updateProgress() {
    if (target > 0) {
      const pct = Math.min(Math.round((count / target) * 100), 100);
      progressBar.style.width = pct + "%";
      progressPct.textContent = pct + "%";
    } else {
      progressBar.style.width = "0%";
      progressPct.textContent = "0%";
    }
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem("countHistory")) || [];
    historyList.innerHTML = "";
    if (history.length === 0) {
      historyList.innerHTML = '<li class="empty-history">No saves yet — hit 💾 to record a count</li>';
      historyBadge.textContent = "0 saved";
      return;
    }
    historyBadge.textContent = history.length + " saved";
    history.slice().reverse().forEach((item) => {
      const li = document.createElement("li");
      li.className = "history-item";
      li.innerHTML = `<span class="history-value">${item.value}</span><span class="history-time">${item.time}</span>`;
      historyList.appendChild(li);
    });
  }

  // Load saved data on startup
  window.onload = () => {
    const saved = localStorage.getItem("savedCount");
    const theme = localStorage.getItem("theme");
    if (saved) count = parseInt(saved);
    if (theme === "light") {
      document.body.classList.add("light");
      document.getElementById("themeBtn").textContent = "☀️";
    }
    updateDisplay();
    renderHistory();
  };

  // Increment
  document.getElementById("incrementBtn").addEventListener("click", () => {
    const val = parseInt(document.getElementById("customInput").value) || 1;
    count += val;
    updateDisplay();
  });

  // Decrement
  document.getElementById("decrementBtn").addEventListener("click", () => {
    const val = parseInt(document.getElementById("customInput").value) || 1;
    if (count - val >= 0) {
      count -= val;
      updateDisplay();
    } else {
      showToast("⚠️ Count can't go below 0");
    }
  });

  // Set target
  document.getElementById("targetInput").addEventListener("input", () => {
    target = parseInt(document.getElementById("targetInput").value) || 0;
    updateProgress();
  });

  // Reset — only resets counter, history stays safe
  document.getElementById("resetBtn").addEventListener("click", () => {
    count = 0;
    updateDisplay();
    showToast("↺ Counter reset to 0");
  });

  // Save
  document.getElementById("saveBtn").addEventListener("click", () => {
    let history = JSON.parse(localStorage.getItem("countHistory")) || [];
    const now = new Date();
    const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    history.push({ value: count, time });
    localStorage.setItem("countHistory", JSON.stringify(history));
    renderHistory();
    showToast("💾 Count " + count + " saved!");
  });

  // Clear history only
  document.getElementById("deleteBtn").addEventListener("click", () => {
    localStorage.removeItem("countHistory");
    renderHistory();
    showToast("🗑 History cleared");
  });

  // Theme toggle
  document.getElementById("themeBtn").addEventListener("click", () => {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    document.getElementById("themeBtn").textContent = isLight ? "☀️" : "🌙";
    localStorage.setItem("theme", isLight ? "light" : "dark");
  });
</script>

</body>
</html>
